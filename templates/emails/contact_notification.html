{% extends "emails/_base.html" %}
{% block title %}Nouveau message contact — IbiHub{% endblock %}
{% block content %}
<h1 style="margin:0 0 16px;font-size:22px;color:#014431;">Nouveau message — Contact</h1>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="margin-bottom:16px;">
  <tr>
    <td style="padding:10px 0;font-size:14px;color:#6b7280;width:120px;vertical-align:top;">Nom</td>
    <td style="padding:10px 0;font-size:14px;color:#1F2937;font-weight:600;border-bottom:1px solid #eef2f1;">{{ name }}</td>
  </tr>
  <tr>
    <td style="padding:10px 0;font-size:14px;color:#6b7280;vertical-align:top;">E-mail</td>
    <td style="padding:10px 0;font-size:14px;border-bottom:1px solid #eef2f1;">
      <a href="mailto:{{ email }}" style="color:#0F7B6C;text-decoration:none;">{{ email }}</a>
    </td>
  </tr>
  <tr>
    <td style="padding:10px 0;font-size:14px;color:#6b7280;vertical-align:top;">Sujet</td>
    <td style="padding:10px 0;font-size:14px;color:#1F2937;border-bottom:1px solid #eef2f1;">{{ subject }}</td>
  </tr>
</table>
<div style="padding:16px;background:#f8faf9;border:1px solid #d9e5e1;border-radius:10px;font-size:14px;line-height:1.7;color:#374151;white-space:pre-wrap;">{{ message }}</div>
<p style="margin:20px 0 0;">
  <a href="mailto:{{ email }}" style="display:inline-block;padding:14px 28px;font-size:15px;font-weight:700;color:#ffffff;text-decoration:none;border-radius:8px;background:#f35c16;">Répondre au visiteur</a>
</p>
{% endblock %}
