<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="x-ua-compatible" content="ie=edge">
  <title>{% block title %}IbiHub{% endblock %}</title>
</head>
<body style="margin:0;padding:0;background:#eef2f1;font-family:Arial,Helvetica,sans-serif;-webkit-text-size-adjust:100%;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#eef2f1;padding:24px 12px;">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:600px;background:#ffffff;border-radius:16px;overflow:hidden;box-shadow:0 4px 24px rgba(1,68,49,.08);">
          <!-- Header -->
          <tr>
            <td style="background:linear-gradient(135deg,#014431 0%,#0F7B6C 100%);padding:28px 32px;">
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
                <tr>
                  <td>
                    <div style="font-size:28px;font-weight:800;color:#ffffff;letter-spacing:-0.5px;line-height:1;">IbiHub</div>
                    <div style="margin-top:6px;font-size:13px;color:rgba(255,255,255,.88);">Le hub des commerçants africains</div>
                  </td>
                  <td align="right" valign="middle">
                    <div style="width:44px;height:44px;border-radius:12px;background:rgba(255,255,255,.15);text-align:center;line-height:44px;font-size:22px;color:#fff;">&#127970;</div>
                  </td>
                </tr>
              </table>
            </td>
          </tr>
          <!-- Body -->
          <tr>
            <td style="padding:32px 32px 24px;color:#1F2937;">
              {% block content %}{% endblock %}
            </td>
          </tr>
          <!-- Footer -->
          <tr>
            <td style="background:#f8faf9;border-top:1px solid #e5ebe9;padding:24px 32px;text-align:center;">
              <p style="margin:0 0 8px;font-size:13px;color:#6b7280;line-height:1.6;">
                Besoin d'aide ? <a href="mailto:contact@ibihub.bj" style="color:#0F7B6C;text-decoration:none;font-weight:600;">contact@ibihub.bj</a>
              </p>
              <p style="margin:0 0 12px;font-size:12px;color:#9ca3af;">
                <a href="https://ibihub.bj/confidentialite/" style="color:#0F7B6C;text-decoration:none;">Confidentialité</a>
                &nbsp;·&nbsp;
                <a href="https://ibihub.bj/cgu/" style="color:#0F7B6C;text-decoration:none;">CGU</a>
              </p>
              <p style="margin:0;font-size:11px;color:#b0b8b5;">© {% now "Y" %} IbiHub — Cotonou, Bénin</p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
