# fly.toml — IbiHub
# Voir docs/DEPLOY_FLY.md pour le guide complet.

app = 'ibihub'
primary_region = 'cdg'

[build]

[env]
  PORT = '8000'
  DEBUG = 'False'
  LANGUAGE_CODE = 'fr-fr'
  TIME_ZONE = 'Africa/Porto-Novo'
  MEDIA_ROOT = '/data/media'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 250
    soft_limit = 200

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1

[mounts]
  source = 'ibihub_media'
  destination = '/data/media'
  initial_size = '1gb'

[deploy]
  release_command = 'python manage.py migrate --noinput'
